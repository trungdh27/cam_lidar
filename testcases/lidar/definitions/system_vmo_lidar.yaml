catalog_id: system_vmo_lidar
source_csv: ../source/system_vmo_lidar.csv
source_encoding: cp1252
device: lidar

# Execution policy is intentionally separate from historical CSV results.
# The loader requires an exact one-to-one ID match with the source CSV.
cases:
  TC-ENV-001:
    automation_level: AUTO
    priority: P1
    timeout: 30
    executor: ros2_environment
    requires_ros2_target: false
    related_existing_tests: [LID-CON-001, LID-CON-002, LID-CON-003]
    parameters: [host, username, port, lidar_interface, host_cidr, lidar_ip, container_name, lidar_publisher, topics]
  TC-NET-001:
    automation_level: AUTO
    priority: P1
    timeout: 30
    executor: ros2_network
    requires_ros2_target: true
    related_existing_tests: [LID-CON-001, LID-CON-002, LID-CON-003]
    parameters: [lidar_interface, host_cidr, lidar_ip, container_name, udp_ports]
  TC-ROS-001:
    automation_level: AUTO
    priority: P1
    timeout: 45
    executor: ros2_topics
    requires_ros2_target: true
    related_existing_tests: [LID-STR-001, LID-STR-002]
    parameters: [lidar_publisher, pointcloud2_topic, custom_topic, imu_topic, topic_types]
  TC-ROS-002:
    automation_level: AUTO
    priority: P1
    timeout: 75
    executor: ros2_pointcloud_rate
    requires_ros2_target: true
    related_existing_tests: [LID-STR-004]
    parameters: [pointcloud2_topic, sample_duration_sec, pointcloud_rate_tolerance_percent]
  TC-ROS-003:
    automation_level: AUTO
    priority: P1
    timeout: 75
    executor: ros2_imu_topic
    requires_ros2_target: true
    related_existing_tests: [LID-STR-002, LID-STR-003]
    parameters: [imu_topic, imu_type, lidar_publisher, sample_duration_sec, imu_rate_tolerance_percent]
  TC-ROS-004:
    automation_level: AUTO
    priority: P1
    timeout: 30
    executor: ros2_custom_message
    requires_ros2_target: true
    related_existing_tests: []
    parameters: [custom_topic, custom_type, custom_fields, custom_rate_tolerance_percent]
  TC-ROS-005:
    automation_level: AUTO
    priority: P1
    timeout: 30
    executor: ros2_pointcloud_schema
    requires_ros2_target: true
    related_existing_tests: []
    parameters: [pointcloud2_topic, pointcloud2_type, pointcloud_frame, pointcloud_fields]
  TC-ROS-006:
    automation_level: AUTO
    priority: P1
    timeout: 30
    executor: ros2_frame_tf
    requires_ros2_target: true
    related_existing_tests: []
    parameters: [pointcloud_frame, imu_frame, robot_base_frame, tf_topics]
  TC-ROS-007:
    automation_level: AUTO
    priority: P1
    timeout: 90
    executor: ros2_bag
    requires_ros2_target: true
    related_existing_tests: []
    parameters: [bag_duration_sec, bag_root, production_ros_domain_id, isolated_ros_domain_id, bag_topics]
  TC-PCD-001:
    automation_level: GUIDED
    priority: P4
    timeout: 900
    executor: guided
    requires_ros2_target: false
    related_existing_tests: [LID-STR-001]
    parameters: [pointcloud2_topic, pointcloud_frame, observation_duration_sec]
  TC-PCD-002:
    automation_level: GUIDED
    priority: P4
    timeout: 1800
